name: Drive export

# One-off: exports the Drive files listed in scripts/drive_export.json as
# site images and commits them back to the working branch. main is excluded.
on:
  push:
    branches-ignore: [main]
    paths:
      - scripts/drive_export.py
      - scripts/drive_export.json
      - .github/workflows/drive-export.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drive-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and script dependencies
        run: |
          command -v ffprobe || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          pip install -r scripts/requirements.txt

      - name: Export
        env:
          DRIVE_SA_KEY: ${{ secrets.DRIVE_SA_KEY }}
        run: python3 scripts/drive_export.py

      - name: Build WebP thumbnails
        run: python3 scripts/make_thumbs.py

      - name: Commit and push if changed
        run: |
          git add -A assets/images/drive
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Drive export: X Shadyside organic social images"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

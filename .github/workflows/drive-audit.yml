name: Drive audit

# Maps everything the Drive service account can see and makes contact sheets
# for review (scripts/drive_audit.py). Runs on push to a working branch when
# the script or its config changes, and commits _inventory/ back to that
# branch. main is excluded: the audit output is for review, not the site.
on:
  push:
    branches-ignore: [main]
    paths:
      - scripts/drive_audit.py
      - scripts/drive_audit.json
      - .github/workflows/drive-audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drive-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg, fonts and script dependencies
        run: |
          command -v ffprobe || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          sudo apt-get install -y -q fonts-dejavu-core || true
          pip install -r scripts/requirements.txt

      - name: Audit
        env:
          DRIVE_SA_KEY: ${{ secrets.DRIVE_SA_KEY }}
        run: python3 scripts/drive_audit.py

      - name: Build WebP thumbnails for exported site images
        run: python3 scripts/make_thumbs.py

      - name: Commit and push if changed
        if: always()
        run: |
          mkdir -p _inventory && git add -A _inventory assets/images/drive
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Drive audit: refresh _inventory and exported images"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

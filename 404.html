<!-- A missing root-level page that exists under /blog/, /work/ or /services/ forwards there,
     keeping the query string and hash: crawlers have requested every post at the root
     (/cross-brand-partnerships-guide.html instead of /blog/...). It runs before the analytics
     tags so the forward usually happens before a 404 pageview is sent. Other misses stay here. -->
<script>
  (function () {
    var m = location.pathname.match(/^\/([a-z0-9-]+)(?:\.html)?\/?$/i);
    if (!m || !window.fetch) return;
    var name = m[1].toLowerCase(), dirs = ['blog', 'work', 'services'];
    (function next(i) {
      if (i === dirs.length) return;
      var url = '/' + dirs[i] + '/' + name + '.html';
      fetch(url, { method: 'HEAD' }).then(function (r) {
        if (r.ok) location.replace(url + location.search + location.hash); else next(i + 1);
      }, function () {});
    })(0);
  })();
</script>
